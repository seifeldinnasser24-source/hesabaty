<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<meta name="theme-color" content="#1f6feb">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="حساباتي">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="favicon-96.png">
<title>حساباتي</title>
<style>
:root{--bg:#f4f6f9;--card:#fff;--tx:#1d2330;--mut:#6b7385;--bd:#e3e7ee;--pri:#1f6feb;--pri2:#e7f0ff;--ok:#1a7f4b;--okb:#e3f6ec;--bad:#c92a2a;--badb:#fdecec;--warn:#b35c00;--warnb:#fff3e0;--r:12px;--sh:0 1px 3px rgba(16,24,40,.08)}
@media (prefers-color-scheme:dark){:root{--bg:#12151c;--card:#1b2029;--tx:#e8ebf1;--mut:#98a1b3;--bd:#2c3340;--pri:#4c8dff;--pri2:#1d2a44;--ok:#4cc38a;--okb:#16302a;--bad:#ff6b6b;--badb:#3a1d1f;--warn:#ffa94d;--warnb:#3a2a17}}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Cairo","Segoe UI",Tahoma,Arial,sans-serif;font-size:15px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--bd);background:var(--card);border-radius:9px;padding:7px 12px;transition:.15s}
button:hover{border-color:var(--pri)}
button.p{background:var(--pri);border-color:var(--pri);color:#fff}
button.d{color:var(--bad)}
button.sm{padding:3px 9px;font-size:13px}
button.ic{padding:4px 8px;border:none;background:transparent;font-size:15px}
button.ic:hover{background:var(--pri2)}
input,select,textarea{width:100%;border:1px solid var(--bd);background:var(--card);border-radius:9px;padding:8px 10px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--pri);box-shadow:0 0 0 3px var(--pri2)}
textarea{min-height:90px;resize:vertical}
label{display:block;font-size:13px;color:var(--mut);margin-bottom:10px}
label>input,label>select,label>textarea{margin-top:4px;font-size:15px}
.app{display:flex;min-height:100vh}
.nav{width:210px;background:var(--card);border-left:1px solid var(--bd);padding:16px 10px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:4px;flex-shrink:0}
.brand{font-weight:800;font-size:20px;padding:4px 10px 16px;display:flex;align-items:center;gap:8px}
.nav button{border:none;background:transparent;text-align:right;padding:10px 12px;border-radius:10px;display:flex;align-items:center;gap:10px;font-weight:600;color:var(--mut)}
.nav button.on{background:var(--pri2);color:var(--pri)}
.nav button .e{font-size:18px;width:22px;text-align:center}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:10px;padding:14px 22px;border-bottom:1px solid var(--bd);background:var(--card);position:sticky;top:0;z-index:5}
.top h1{font-size:19px;margin:0;flex:1}
.bell{position:relative;font-size:18px;padding:5px 10px}
.bell b{position:absolute;top:-6px;left:-6px;background:var(--bad);color:#fff;border-radius:20px;font-size:11px;min-width:19px;height:19px;display:none;align-items:center;justify-content:center;padding:0 5px}
#view{padding:20px 22px 90px;max-width:1250px;width:100%}
#view.full{padding:0;max-width:none;flex:1;display:flex;flex-direction:column;height:calc(100dvh - 60px)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);padding:16px;box-shadow:var(--sh)}
.card h3{margin:0 0 12px;font-size:16px;display:flex;align-items:center;gap:8px}
.card h3 .sp{flex:1}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.stat{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);padding:14px;box-shadow:var(--sh)}
.stat small{color:var(--mut);font-size:13px}
.stat b{display:block;font-size:21px;margin-top:2px;direction:ltr;text-align:right}
.ok{color:var(--ok)}.bad{color:var(--bad)}.warn{color:var(--warn)}.mut{color:var(--mut)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}
.quick{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.quick button{font-weight:700}
.list{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:10px;padding:9px 4px;border-bottom:1px solid var(--bd)}
.row:last-child{border-bottom:none}
.row .g{flex:1;min-width:0}
.row .g small{color:var(--mut);display:block;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.amt{font-weight:700;direction:ltr;white-space:nowrap}
.dot{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:16px}
.dot.ok{background:var(--okb)}.dot.bad{background:var(--badb)}.dot.pri{background:var(--pri2)}.dot.warn{background:var(--warnb)}
.empty{color:var(--mut);text-align:center;padding:22px 8px;font-size:14px}
.alert{display:flex;gap:10px;align-items:center;padding:9px 11px;border-radius:10px;margin-bottom:7px;font-size:14px;cursor:pointer}
.alert.bad{background:var(--badb);color:var(--bad)}.alert.warn{background:var(--warnb);color:var(--warn)}.alert.info{background:var(--pri2);color:var(--pri)}
.alert span{flex:1}
.bar{height:8px;background:var(--bd);border-radius:6px;overflow:hidden;margin-top:5px}
.bar i{display:block;height:100%;background:var(--pri);border-radius:6px}
.bar i.warn{background:var(--warn)}.bar i.bad{background:var(--bad)}.bar i.ok{background:var(--ok)}
.cbar{margin-bottom:11px;font-size:14px}
.cbar .h{display:flex;justify-content:space-between;gap:8px}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
.filters>*{width:auto;min-width:130px}
.filters input[type=search]{flex:1;min-width:160px}
.tot{display:flex;gap:18px;flex-wrap:wrap;margin-bottom:12px;font-size:14px}
.tot b{direction:ltr;display:inline-block}
.accs{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.acc .ty{font-size:13px;color:var(--mut)}
.acc .bal{font-size:24px;font-weight:800;direction:ltr;text-align:right;margin:8px 0}
.acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.tag{font-size:12px;padding:2px 9px;border-radius:20px;font-weight:700;white-space:nowrap}
.tag.ok{background:var(--okb)}.tag.bad{background:var(--badb)}.tag.warn{background:var(--warnb)}.tag.info{background:var(--pri2);color:var(--pri)}.tag.mut{background:var(--bd)}
.debts{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px}
.debt .dh{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.debt .dh b{font-size:17px;flex:1}
.amts{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:12px 0 6px;font-size:12.5px;color:var(--mut)}
.amts b{display:block;color:var(--tx);font-size:15px;direction:ltr;text-align:right}
.debt.settled{opacity:.6}
.seg{display:flex;background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:3px;margin-bottom:12px;gap:3px;flex-wrap:wrap}
.seg label{flex:1;margin:0;text-align:center;min-width:70px}
.seg input{display:none}
.seg span{display:block;padding:6px 8px;border-radius:8px;cursor:pointer;color:var(--mut);font-weight:600;font-size:14px}
.seg input:checked+span{background:var(--card);color:var(--pri);box-shadow:var(--sh)}
.tabs{display:inline-flex;margin-bottom:0}
.tabs button{border:none;background:transparent;font-weight:600;color:var(--mut);padding:6px 14px}
.tabs button.on{background:var(--card);color:var(--pri);box-shadow:var(--sh)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:-4px 0 12px}
.chips button{padding:3px 10px;font-size:13px;border-radius:20px}
.chips button.on{background:var(--pri2);border-color:var(--pri);color:var(--pri)}
.sw{display:flex;gap:8px;flex-wrap:wrap;margin:4px 0 12px}
.sw label{margin:0}
.sw input{display:none}
.sw span{display:block;width:28px;height:28px;border-radius:50%;border:2px solid var(--bd);cursor:pointer}
.sw input:checked+span{border-color:var(--pri);box-shadow:0 0 0 3px var(--pri2)}
.chk{display:flex;align-items:center;gap:8px;color:var(--tx);font-size:14px}
.chk input{width:auto}
.notes{columns:4 240px;column-gap:14px}
.note{break-inside:avoid;margin-bottom:14px;border-radius:var(--r);padding:14px;color:#1d2330;border:1px solid rgba(0,0,0,.07);box-shadow:var(--sh)}
.note h4{margin:0 0 6px;font-size:16px;display:flex;gap:6px;align-items:flex-start}
.note h4 span{flex:1}
.note p{margin:0;white-space:pre-wrap;font-size:14px}
.note .rm{font-size:12.5px;margin-top:10px;display:inline-block;padding:2px 9px;border-radius:20px;background:rgba(0,0,0,.07)}
.note .rm.due{background:#c92a2a;color:#fff}
.note.done{opacity:.55}.note.done h4 span{text-decoration:line-through}
.note .acts button{background:rgba(255,255,255,.6);border-color:rgba(0,0,0,.1);color:#1d2330}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:8px 6px;border-bottom:1px solid var(--bd);text-align:right}
th{color:var(--mut);font-weight:600;font-size:13px}
td.n{direction:ltr;text-align:right;font-weight:700}
.sets{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px}
.bud{display:grid;grid-template-columns:1fr 120px;gap:8px;align-items:center;margin-bottom:6px;font-size:14px}
/* board */
.btool{display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding:10px 14px;background:var(--card);border-bottom:1px solid var(--bd)}
.btool select{width:auto;min-width:120px;padding:6px 8px}
.btool .sep{width:1px;height:26px;background:var(--bd);margin:0 4px}
.btool .tool{padding:6px 10px;font-size:14px}
.btool .tool.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.pal{display:flex;gap:5px}
.pal button{width:24px;height:24px;border-radius:50%;padding:0;border:2px solid transparent}
.pal button.on{border-color:var(--tx)}
.bhint{font-size:13px;color:var(--mut);padding:6px 14px;background:var(--bg);border-bottom:1px solid var(--bd)}
.bwrap{position:relative;flex:1;min-height:420px}
#cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none;background:#fbfcfe;user-select:none;-webkit-user-select:none}
#cv.t-select{cursor:grab}#cv.t-box{cursor:copy}#cv.t-link{cursor:crosshair}#cv.t-pen{cursor:crosshair}#cv.t-erase{cursor:not-allowed}
.selbar{position:absolute;bottom:16px;left:50%;transform:translateX(-50%);background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:6px;display:none;gap:6px;box-shadow:0 4px 16px rgba(0,0,0,.15)}
/* modal & toast */
.modal{position:fixed;inset:0;background:rgba(10,14,22,.45);display:none;align-items:center;justify-content:center;z-index:50;padding:14px}
.modal.open{display:flex}
.mbox{background:var(--card);border-radius:16px;width:100%;max-width:500px;max-height:92vh;display:flex;flex-direction:column;box-shadow:0 20px 50px rgba(0,0,0,.3)}
.mhead{display:flex;align-items:center;padding:14px 18px;border-bottom:1px solid var(--bd)}
.mhead h2{margin:0;font-size:17px;flex:1}
#mBody{padding:16px 18px;overflow:auto}
.mfoot{display:flex;gap:8px;padding:12px 18px;border-top:1px solid var(--bd);justify-content:flex-start}
#toast{position:fixed;bottom:20px;left:20px;z-index:60;display:flex;flex-direction:column;gap:8px;max-width:340px}
#toast div{background:#1d2330;color:#fff;padding:10px 14px;border-radius:10px;font-size:14px;box-shadow:0 6px 20px rgba(0,0,0,.25);animation:tin .2s}
#toast div.bad{background:#c92a2a}#toast div.warn{background:#b35c00}
@keyframes tin{from{transform:translateY(10px);opacity:0}}
.nav .ns,#moreBtn{display:none}
.moreg{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}.moreg button{display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 8px;font-weight:600;font-size:14px}.moreg button span{font-size:24px}.moreg button.on{background:var(--pri2);border-color:var(--pri);color:var(--pri)}
.row.fut{opacity:.72}
@media (max-width:900px){.nav .sec{display:none}.nav .nl{display:none}.nav .ns{display:block}#moreBtn{display:flex}.nav{overflow-x:visible}}
.qbar{display:flex;gap:8px;margin-bottom:6px}.qbar input{flex:1;font-size:16px}.qprev{font-size:13.5px;margin:0 4px 14px;min-height:20px;line-height:1.6}
.mbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:14px}.mbar input{width:auto}.mbar button:disabled{opacity:.4;cursor:default}
.flow{margin-bottom:16px}.frow{display:flex;justify-content:space-between;gap:10px;padding:8px 2px;border-bottom:1px dashed var(--bd);font-size:15px}
.frow.tot{border-bottom:none;border-top:2px solid var(--bd);margin-top:4px;padding-top:12px;font-size:17px;font-weight:700}.frow .mut{font-size:12.5px;font-weight:400}
.oc{display:flex;flex-direction:column;gap:2px;margin-top:4px;font-size:13px;color:var(--mut)}.oc span{display:flex;justify-content:space-between;gap:8px}.oc b{direction:ltr;font-size:15px}
.hb{font-size:17px;padding:5px 8px}.hb:disabled{opacity:.35;cursor:default;background:transparent}
.warnb{background:var(--warnb)!important;color:var(--warn)}
#toast div button{background:#fff;color:#1d2330;border:none;padding:2px 10px;margin-inline-start:10px;font-size:13px;font-weight:700}
table.grid{font-size:13px}table.grid td,table.grid th{text-align:center;padding:5px 4px;white-space:nowrap}table.grid td:first-child,table.grid th:first-child{text-align:right;position:sticky;right:0;background:var(--card)}
table.grid .cur{background:var(--pri2)}table.grid input{width:auto}
/* ===== شاشة القفل: قفل بخانات أرقام بتلف ===== */
.lock{position:fixed;inset:0;z-index:100;display:none;flex-direction:column;align-items:center;justify-content:center;gap:clamp(14px,3.2vh,26px);padding:calc(18px + env(safe-area-inset-top)) 16px calc(18px + env(safe-area-inset-bottom));background:radial-gradient(ellipse at 50% 28%,#1d2432 0%,#0b0e14 72%);color:#e8ebf1;user-select:none;-webkit-user-select:none;touch-action:manipulation;overflow:hidden;--amb:#f5a524;--rh:76px;--rw:64px;--rf:40px}
.lock.open{display:flex}.lock.out{animation:lkout .45s ease forwards}
@keyframes lkout{to{opacity:0;transform:scale(1.05)}}
.ltitle{font-size:15px;color:#8a93a6;font-weight:600;display:flex;align-items:center;gap:8px}
.pl{position:relative;width:min(92vw,380px);padding-top:84px}
.shk{position:absolute;left:50%;top:0;width:56%;height:124px;transform:translateX(-50%);transform-origin:86% 100%;transition:transform .6s cubic-bezier(.3,1.5,.5,1)}
.shk svg{width:100%;height:100%;display:block;overflow:visible}
.pl.open .shk{transform:translateX(-50%) translateY(-30px) rotate(-24deg)}
.lbody{position:relative;z-index:1;background:linear-gradient(180deg,#252d3b,#161b25);border:1px solid #303a4a;border-radius:26px;padding:26px 14px 18px;box-shadow:0 22px 50px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.07)}
.scr{position:absolute;width:9px;height:9px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#5b6577,#262d39);box-shadow:inset 0 0 0 1px rgba(0,0,0,.4)}
.scr:nth-child(1){top:14px;left:14px}.scr:nth-child(2){top:14px;right:14px}.scr:nth-child(3){bottom:14px;left:14px}.scr:nth-child(4){bottom:14px;right:14px}
.reels{display:flex;justify-content:center;gap:clamp(6px,2.4vw,12px);direction:ltr}
.rc{display:flex;flex-direction:column;align-items:center;gap:12px}
.reel{width:var(--rw);height:var(--rh);border-radius:14px;background:linear-gradient(180deg,#0b0e14,#151a24);border:2px solid #2a3343;overflow:hidden;position:relative;box-shadow:inset 0 6px 12px rgba(0,0,0,.6);transition:border-color .2s,box-shadow .2s}
.reel::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(8,10,15,.88),transparent 30%,transparent 70%,rgba(8,10,15,.88));pointer-events:none;z-index:1}
.reel.on{border-color:var(--amb);box-shadow:0 0 0 3px rgba(245,165,36,.16),0 0 18px rgba(245,165,36,.32)}
.reel.on::before{content:"";position:absolute;bottom:10px;left:28%;right:28%;height:3px;border-radius:3px;background:var(--amb);z-index:2;animation:lkblink 1s steps(2) infinite}
@keyframes lkblink{50%{opacity:0}}
.strip{transition:transform .55s cubic-bezier(.2,.9,.25,1.12);will-change:transform}
.strip div{height:var(--rh);display:flex;align-items:center;justify-content:center;font:800 var(--rf)/1 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-variant-numeric:tabular-nums;color:#f2f4f8}
.strip div:last-child{font-size:calc(var(--rf) * .55)}
.dot{width:8px;height:8px;border-radius:50%;background:#394253;transition:background .2s,box-shadow .2s}
.dot.f{background:var(--amb);box-shadow:0 0 8px var(--amb)}
.lhint{margin-top:16px;text-align:center;font-size:13.5px;color:#8a93a6;min-height:20px;transition:color .2s}
.pl.bad .lbody{animation:lkshake .5s}.pl.bad .reel{border-color:#ff5d5d;box-shadow:0 0 14px rgba(255,93,93,.35)}.pl.bad .dot.f{background:#ff5d5d;box-shadow:0 0 8px #ff5d5d}.pl.bad .lhint{color:#ff7b7b}
.pl.ok .reel{border-color:#3ddc84;box-shadow:0 0 14px rgba(61,220,132,.35)}.pl.ok .dot.f{background:#3ddc84;box-shadow:0 0 8px #3ddc84}.pl.ok .lhint{color:#3ddc84}
@keyframes lkshake{10%,90%{transform:translateX(-2px)}20%,80%{transform:translateX(4px)}30%,50%,70%{transform:translateX(-9px)}40%,60%{transform:translateX(9px)}}
.kp{display:grid;grid-template-columns:repeat(3,auto);gap:clamp(10px,2vh,16px) clamp(18px,7vw,30px);direction:ltr}
.kp button{width:clamp(62px,18vw,74px);height:clamp(62px,18vw,74px);border-radius:50%;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.09);color:#f2f4f8;font:600 28px/1 system-ui,sans-serif;padding:0;display:flex;align-items:center;justify-content:center;transition:background .12s,transform .08s}
.kp button:hover{border-color:rgba(245,165,36,.5)}.kp button:active{background:rgba(245,165,36,.28);transform:scale(.94)}
.kp .ks{background:transparent;border-color:transparent;font-size:22px}.kp .ks:disabled{visibility:hidden}
.kp .go{background:var(--amb);color:#1d1400;border-color:var(--amb)}
.lkb{background:none;border:none;color:#7c8598;font-size:13px;text-decoration:underline;padding:4px}
.ltxt{display:none;gap:8px;width:min(92vw,380px)}.ltxt.on{display:flex}.ltxt input{flex:1;background:#121722;border-color:#2a3343;color:#f2f4f8;text-align:center}
.lock.lockout .kp{opacity:.35;pointer-events:none}
@media (max-height:640px){.lock{--rh:62px;--rf:32px}.pl{padding-top:66px}.shk{height:100px}}
@media (prefers-reduced-motion:reduce){.strip,.shk{transition:none}.pl.bad .lbody{animation:none}.reel.on::before{animation:none}}
.snap{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--bd);font-size:14px}.snap span{flex:1}
.printh{display:none}
@media print{.nav,.top,.noprint,#toast,.modal,.acts,.quick{display:none!important}body{background:#fff;color:#000}.app{display:block}#view{padding:0;max-width:none}.card,.stat{box-shadow:none;break-inside:avoid}.printh{display:block}.grid2{grid-template-columns:1fr 1fr}}
/* ===== عناصر الموبايل (مخفية على الكمبيوتر) ===== */
.fab,.fabm,.mact{display:none}
.accpick{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 12px}
.accpick label{margin:0}.accpick input{display:none}
.accpick span{display:flex;flex-direction:column;align-items:center;padding:7px 12px;border:1px solid var(--bd);border-radius:10px;cursor:pointer;font-size:14px;font-weight:600;color:var(--tx);background:var(--card);min-width:84px;line-height:1.3}
.accpick span small{font-size:11.5px;font-weight:400;color:var(--mut);direction:ltr}
.accpick input:checked+span{border-color:var(--pri);background:var(--pri2);color:var(--pri);box-shadow:0 0 0 2px var(--pri2)}
.fl{display:block;font-size:13px;color:var(--mut);margin-bottom:2px}

<script>
'use strict';
/* ================= أساسيات ================= */
const KEY='hesabaty_v1';
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const dstr=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today=()=>dstr(new Date());
const thisMonth=()=>today().slice(0,7);
const toLocalDT=d=>dstr(d)+'T'+pad(d.getHours())+':'+pad(d.getMinutes());
const LOC='ar-EG-u-nu-latn';
const fmtN=n=>(Math.round((+n||0)*100)/100).toLocaleString('en-US',{maximumFractionDigits:2});
const fmt=n=>fmtN(n)+' '+S.settings.cur;
const fmtD=d=>{if(!d)return'';try{return new Date(d+'T00:00').toLocaleDateString(LOC,{day:'numeric',month:'short',year:'numeric'})}catch(e){return d}};
const fmtDT=d=>{if(!d)return'';try{return new Date(d).toLocaleString(LOC,{weekday:'short',day:'numeric',month:'short',hour:'numeric',minute:'2-digit'})}catch(e){return d}};
const daysTo=d=>Math.round((new Date(d+'T00:00')-new Date(today()+'T00:00'))/864e5);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function upsert(arr,o){const i=arr.findIndex(x=>x.id===o.id);if(i>=0)arr[i]=o;else arr.push(o)}

const ACCT={cash:['كاش','💵'],wallet:['محفظة','📱'],instapay:['إنستاباي','⚡'],bank:['بنك','🏦']};
const ACC_PRESETS=[['كاش','cash'],['كاش البيت','cash'],['فودافون كاش','wallet'],['اتصالات كاش','wallet'],['أورانج كاش','wallet'],['وي باي','wallet'],['إنستاباي','instapay'],['البنك الأهلي','bank'],['بنك مصر','bank'],['CIB','bank'],['بنك القاهرة','bank'],['QNB','bank']];
const CYC={monthly:['شهري',1],quarterly:['كل 3 شهور',3],yearly:['سنوي',12],weekly:['أسبوعي',0]};
const SUB_PRESETS=['نت البيت','باقة الموبايل','نتفليكس','شاهد','سبوتيفاي','يوتيوب بريميوم','ChatGPT / Claude','جوجل درايف / iCloud','الجيم','جمعية','قسط','إيجار'];
const PAL=[['#fff3bf','#d9a400'],['#d3f9d8','#2f9e44'],['#d0ebff','#1c7ed6'],['#ffe3e3','#e03131'],['#f3d9fa','#9c36b5'],['#ffe8cc','#e8590c'],['#f1f3f5','#495057']];
const NPAL=['#fff9db','#e6fcf5','#e7f5ff','#fff0f6','#f3f0ff','#fff4e6','#f1f3f5'];
const REP={none:'مرة واحدة',daily:'كل يوم',weekly:'كل أسبوع',monthly:'كل شهر'};

function defaults(){return{accounts:[],txs:[],debts:[],notes:[],boards:[],subs:[],gams:[],assets:[],goals:[],budgets:{},people:{},rates:{},meta:{updated:0},
 cats:{exp:['أكل','مواصلات','بنزين','فواتير','اشتراكات','إيجار','تليفون ونت','صحة','لبس','خروج','بيت','تعليم','هدايا','أخرى'],inc:['مرتب','عمولة','شغل إضافي','هدية','أخرى']},
 settings:{cur:'ج.م',debtDays:3,notify:true,view:'home',board:'',lastBackup:'',pin:'',lockMin:5},notified:{}}}
function seed(){const d=defaults();
 [['كاش','cash'],['فودافون كاش','wallet'],['إنستاباي','instapay'],['البنك','bank']].forEach(([name,type])=>d.accounts.push({id:uid(),name,type,opening:0,minAlert:0,note:''}));
 const b={id:uid(),name:'خطتي',view:{x:0,y:0,k:1},nodes:[],edges:[],strokes:[]};
 const c={id:uid(),x:420,y:260,text:'أهدافي المالية',c:0,shape:'ellipse'},n1={id:uid(),x:180,y:120,text:'سداد الديون',c:3,shape:'rect'},n2={id:uid(),x:660,y:120,text:'تحويش للطوارئ',c:1,shape:'rect'},n3={id:uid(),x:420,y:440,text:'تقليل المصاريف',c:2,shape:'rect'};
 b.nodes.push(c,n1,n2,n3);[n1,n2,n3].forEach(n=>b.edges.push({id:uid(),from:c.id,to:n.id,label:''}));
 d.boards.push(b);d.settings.board=b.id;return d}
function normalize(o){const d=defaults();for(const k in d)if(o[k]!==undefined)d[k]=k==='settings'||k==='cats'||k==='meta'?Object.assign(d[k],o[k]):o[k];return d}
/* التخزين: بيبدأ في localStorage (سريع)، ولو البيانات كبرت بيتنقل لوحده لـ IndexedDB (مساحة أكبر بكتير)
   ساعتها localStorage بيبقى فيه علامة بس (IDB_MARK) والبيانات نفسها في IndexedDB. */
const IDB_MARK='__idb__';let MODE='ls',BOOT_WAIT=false;
function load(){try{const raw=localStorage.getItem(KEY);if(raw===IDB_MARK){MODE='idb';BOOT_WAIT=true;return seed()}if(raw)return normalize(JSON.parse(raw))}catch(e){console.error(e)}return seed()}
let S=load();
/* حفظ + تراجع + نقاط استرجاع يومية + حفظ في ملف */
const SNAPK=KEY+'_snaps';let lastJ=null,UNDO=[],SNAPS=null;
function save(opt){if(BOOT_WAIT)return;S.meta.updated=Date.now();const j=JSON.stringify(S),prev=lastJ;
 if(lastJ&&!(opt&&opt.noUndo)&&lastJ!==j){UNDO.push(lastJ);if(UNDO.length>40)UNDO.shift()}lastJ=j;
 snapDaily(prev);writeMain(j);
 fileQueue(j);undoBtn()}
function writeMain(j){if(MODE==='idb'){idbPut('data',j).catch(()=>toast('مقدرتش أحفظ — نزّل نسخة احتياطية فوراً','bad'));return true}
 if(j.length>1.6e6){toIDB(j);return true} /* حوالي 3 ميجا: ننقل قبل ما المساحة تخلص */
 if(safeSet(j))return true;toIDB(j);return true}
async function toIDB(j){if(MODE==='idb')return;MODE='idb';
 try{await idbPut('snaps',JSON.stringify(snapsGetLS()));await idbPut('data',lastJ||j);SNAPS=snapsGetLS();
  try{localStorage.setItem(KEY,IDB_MARK);localStorage.removeItem(SNAPK)}catch(e){}
  toast('📦 بياناتك كبرت، فنقلتها لمساحة أكبر في المتصفح — كله شغال عادي');if(cur==='settings')render()}
 catch(e){MODE='ls';toast('مقدرتش أحفظ — نزّل نسخة احتياطية فوراً','bad')}}
async function idbPut(k,v){const db=await idb();return new Promise((res,rej)=>{const t=db.transaction('h','readwrite');t.objectStore('h').put(v,k);t.oncomplete=()=>res();t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error)})}
async function idbGetK(k){const db=await idb();return new Promise(r=>{const q=db.transaction('h').objectStore('h').get(k);q.onsuccess=()=>r(q.result);q.onerror=()=>r(null)})}
/* نقاط الاسترجاع: في localStorage أو IndexedDB حسب المكان */
function snapsGetLS(){try{return JSON.parse(localStorage.getItem(SNAPK)||'[]')}catch(e){return[]}}
function snapsGet(){return MODE==='idb'?(SNAPS||[]):snapsGetLS()}
function snapsSet(L){if(MODE==='idb'){SNAPS=L;idbPut('snaps',JSON.stringify(L)).catch(()=>{});return}
 L=L.slice();for(;;){try{L.length?localStorage.setItem(SNAPK,JSON.stringify(L)):localStorage.removeItem(SNAPK);return}catch(e){if(!L.length){try{localStorage.removeItem(SNAPK)}catch(_){}return}L.pop()}}}
/* البيانات الأساسية ليها الأولوية: لو المساحة خلصت، امسح أقدم نقاط الاسترجاع وجرّب تاني */
function safeSet(j){for(let i=0;i<7;i++){try{localStorage.setItem(KEY,j);return true}catch(e){
  const L=snapsGetLS();
  if(L.length){L.pop();snapsSet(L);
   if(!safeSet.warned){safeSet.warned=1;toast('⚠️ مساحة المتصفح قربت تخلص — مسحت أقدم نقاط استرجاع عشان بياناتك تتحفظ','warn')}}
  else return false}}return false}
function storageKB(){if(MODE==='idb')return Math.round(((lastJ||'').length+JSON.stringify(SNAPS||[]).length)*2/1024);let n=0;try{for(const k of[KEY,SNAPK])n+=(localStorage.getItem(k)||'').length}catch(e){}return Math.round(n*2/1024)}
function snapDaily(prev){try{const td=today(),dk=SNAPK+'_day';if(!prev||localStorage.getItem(dk)===td)return;
 const L=snapsGet().slice();L.unshift({d:td,t:Date.now(),j:prev});while(L.length>5)L.pop();
 /* في localStorage النسخ متاخدش أكتر من ~1.2 مليون حرف عشان البيانات الأساسية تفضل ليها مكان */
 if(MODE!=='idb'){while(L.length>1&&JSON.stringify(L).length>1.2e6)L.pop();if(JSON.stringify(L).length>1.2e6)L.length=0}
 snapsSet(L);localStorage.setItem(dk,td)}catch(e){}}
/* اطلب من المتصفح ميمسحش البيانات لوحده */
let PERSIST=null;
async function askPersist(force){try{if(!navigator.storage||!navigator.storage.persist){PERSIST='na';return}PERSIST=await navigator.storage.persisted();if(!PERSIST&&(force||true))PERSIST=await navigator.storage.persist()}catch(e){PERSIST='na'}if(force){toast(PERSIST===true?'🛡️ بياناتك محمية من المسح التلقائي':'المتصفح لسه مارضيش — ثبّت التطبيق على الشاشة الرئيسية وجرّب تاني',PERSIST===true?'':'warn');render()}}
function undo(){if(!UNDO.length)return toast('مفيش حاجة أرجعها','warn');const j=UNDO.pop();S=normalize(JSON.parse(j));lastJ=j;
 writeMain(j);fileQueue(j);closeM();BV.sel=null;render();undoBtn();toast('↶ اترجعت آخر خطوة')}
function undoBtn(){const b=$('#undoBtn');if(b)b.disabled=!UNDO.length}
/* ---- ربط ملف للحفظ التلقائي (كروم/إيدج على الكمبيوتر) ---- */
const FS_OK=typeof window!=='undefined'&&'showSaveFilePicker'in window;let FH=null,fileState='none',fileT=null,fileLast='';
function idb(){return new Promise((res,rej)=>{const r=indexedDB.open('hesabaty_fs',1);r.onupgradeneeded=()=>r.result.createObjectStore('h');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function idbSet(v){const db=await idb();return new Promise(r=>{const t=db.transaction('h','readwrite');v?t.objectStore('h').put(v,'file'):t.objectStore('h').delete('file');t.oncomplete=r})}
async function idbGet(){const db=await idb();return new Promise(r=>{const q=db.transaction('h').objectStore('h').get('file');q.onsuccess=()=>r(q.result);q.onerror=()=>r(null)})}
function fileQueue(j){if(!FH||fileState!=='ok')return;clearTimeout(fileT);fileT=setTimeout(()=>fileWrite(j),1200)}
async function fileWrite(j){if(CONF)return;try{j=j||lastJ;const w=await FH.createWritable();await w.write(j);await w.close();localStorage.setItem(FSYNC,metaOf(j));fileLast=new Date().toLocaleTimeString(LOC,{hour:'numeric',minute:'2-digit'});fileBadge()}catch(e){fileState='need';fileBadge()}}
function fileBadge(){const b=$('#fileBtn');if(!b)return;b.style.display=FH?'':'none';b.textContent=fileState==='ok'?'💾✓':'💾!';b.title=fileState==='ok'?'محفوظ في الملف '+(FH&&FH.name)+(fileLast?' — آخر حفظ '+fileLast:''):'الحفظ في الملف متوقف — اضغط عشان تفعّله';b.classList.toggle('warnb',fileState!=='ok')}
async function fileInit(){if(!FS_OK)return;try{FH=await idbGet();if(!FH)return;const p=await FH.queryPermission({mode:'readwrite'});fileState=p==='granted'?'ok':'need';fileBadge();if(fileState==='ok')await fileSync()}catch(e){FH=null}}
/* المزامنة: بنفتكر آخر نسخة اتزامنت (fsync). لو اتعدل هنا بس → نكتب. لو الملف بس → نحمّله. لو الاتنين → نسألك. */
const FSYNC=KEY+'_fsync';let CONF=null;
const metaOf=j=>{const m=/"meta":\{"updated":(\d+)/.exec(j||'');return m?+m[1]:0};
async function fileSync(){try{const f=await FH.getFile(),txt=await f.text();if(!txt.trim()){fileWrite(lastJ);return}const o=JSON.parse(txt);
 const fU=(o.meta&&o.meta.updated)||0,lU=S.meta.updated||0,base=+localStorage.getItem(FSYNC)||0;
 if(Math.abs(fU-lU)<1000){localStorage.setItem(FSYNC,lU);return}
 const fileCh=fU>base+1000,localCh=lU>base+1000;

/* ================= حسابات ================= */
const accById=id=>S.accounts.find(a=>a.id===id);
const accName=id=>{const a=accById(id);return a?a.name:'—'};
/* before: لو اتحدد، بيحسب الرصيد من الحركات اللي تاريخها قبل اليوم ده بس (لحساب أول/آخر الشهر) */
/* من غير before = الرصيد الفعلي لحد النهارده (الحركات المجدولة بتاريخ قدام مش بتتحسب لحد ما ييجي يومها).
   الرصيد الافتتاحي بيتحسب من تاريخه (openDate)؛ الخزن القديمة اللي ملهاش تاريخ بتتحسب من الأول. */
const tomorrow=()=>{const d=new Date();d.setDate(d.getDate()+1);return dstr(d)};
const isFuture=t=>(t.date||'')>today();
const accExists=(a,before)=>!a.openDate||a.openDate<before;
function accBal(id,before){const a=accById(id);if(!a)return 0;before=before||tomorrow();let b=accExists(a,before)?(+a.opening||0):0;
 for(const t of S.txs){if(!((t.date||'')<before))continue;const v=+t.amount||0;
  if(t.type==='inc'&&t.acc===id)b+=v;
  else if(t.type==='exp'&&t.acc===id)b-=v;
  else if(t.type==='trf'){if(t.acc===id)b-=v+(+t.fee||0);if(t.to===id)b+=(t.toAmount!=null&&t.toAmount!==''?+t.toAmount:v)}
  else if(t.sign&&t.acc===id)b+=t.sign*v}
 return b}
/* العملات: كل خزنة ليها عملة (الافتراضي جنيه). الإجماليات بتتحسب بالجنيه بسعر الصرف اللي في الإعدادات */
const CURS={EGP:['جنيه مصري','ج.م'],USD:['دولار','$'],EUR:['يورو','€'],SAR:['ريال سعودي','ر.س'],AED:['درهم إماراتي','د.إ'],KWD:['دينار كويتي','د.ك'],GBP:['جنيه إسترليني','£']};
const accCur=id=>{const a=accById(id);return a&&a.cur&&a.cur!=='EGP'&&CURS[a.cur]?a.cur:'EGP'};
const rateOf=c=>!c||c==='EGP'?1:(+(S.rates||{})[c]||0);
const isFX=id=>accCur(id)!=='EGP';
const fmtC=(n,c)=>!c||c==='EGP'?fmt(n):fmtN(n)+' '+CURS[c][1];
const txE=t=>(+t.amount||0)*rateOf(accCur(t.acc)),feeE=t=>(+t.fee||0)*rateOf(accCur(t.acc));
const accBalE=(id,before)=>accBal(id,before)*rateOf(accCur(id));
const totalBal=before=>S.accounts.reduce((s,a)=>s+accBalE(a.id,before),0);
/* اللي فاضل من الديون لحد يوم معين (قبل before) */
function debtTotalBefore(dir,before){return S.debts.filter(d=>d.dir===dir&&(d.date||'')<before).reduce((s,d)=>s+Math.max(0,(+d.amount||0)-(d.payments||[]).filter(p=>(p.date||'')<before).reduce((x,p)=>x+(+p.amount||0),0)),0)}
const monthStart=mk=>mk+'-01';
const nextMonthStart=mk=>{const d=new Date(mk+'-01T00:00');d.setMonth(d.getMonth()+1);return dstr(d)};
const shiftMonth=(mk,n)=>{const d=new Date(mk+'-01T00:00');d.setMonth(d.getMonth()+n);return d.getFullYear()+'-'+pad(d.getMonth()+1)};
/* قايمة الشهور من أول حركة لحد الشهر الحالي (بدل خانة الشهر اللي مش مدعومة في كل الموبايلات) */
function monthOpts(sel,allLabel){const cm=thisMonth();let first=shiftMonth(cm,-11);for(const t of S.txs){const k=(t.date||'').slice(0,7);if(k&&k<first)first=k}
 const L=[];for(let k=cm,g=0;k>=first&&g<240;k=shiftMonth(k,-1),g++)L.push(k);if(sel&&!L.includes(sel)&&sel<=cm)L.push(sel);
 return(allLabel?`<option value="" ${!sel?'selected':''}>${allLabel}</option>`:'')+L.map(k=>`<option value="${k}" ${k===sel?'selected':''}>${monthLabel(k)}${k===cm?' (الحالي)':''}</option>`).join('')}
const monthLabel=mk=>new Date(mk+'-01T00:00').toLocaleDateString(LOC,{month:'long',year:'numeric'});
const debtPaid=d=>(d.payments||[]).reduce((s,p)=>s+(+p.amount||0),0);
const debtRem=d=>(+d.amount||0)-debtPaid(d);
function addMonths(date,n,day){const d=new Date(date+'T00:00'),t=new Date(d.getFullYear(),d.getMonth()+n,1);t.setDate(Math.min(day||d.getDate(),new Date(t.getFullYear(),t.getMonth()+1,0).getDate()));return dstr(t)}
const monthsSince=s=>{const a=new Date(s+'T00:00'),b=new Date();return(b.getFullYear()-a.getFullYear())*12+b.getMonth()-a.getMonth()};
const instAmt=d=>+d.instN>0?d.amount/d.instN:0;
function instDone(d){return +d.instN>0?Math.min(+d.instN,Math.floor(debtPaid(d)/instAmt(d)+1e-6)):0}
function debtDue(d){if(debtRem(d)<=0.001)return'';if(+d.instN>0&&d.instFirst){const k=instDone(d);return k<+d.instN?addMonths(d.instFirst,k,+d.instFirst.slice(8,10)):''}return d.due||''}
/* جمعيات */
const gamDate=(g,i)=>addMonths(g.start,i,+g.start.slice(8,10));
const gamPot=g=>(+g.share)*(+g.months);
const gamPaidN=g=>(g.paid||[]).length;
/* فلوس الأعضاء اللي معاك لو انت ماسك الجمعية (استلمتها ولسه ماسلّمتهاش) — دي مش بتاعتك */
const gamHeld=g=>S.txs.filter(t=>t.gamId===g.id&&(t.orgCell||t.orgPay!=null)).reduce((s,t)=>s+t.sign*(+t.amount),0);
const gamNet=g=>gamPaidN(g)*(+g.share)-(g.received?gamPot(g):0)-gamHeld(g); /* موجب = ليا، سالب = عليا */
function gamNextIdx(g){for(let i=0;i<+g.months;i++)if(!(g.paid||[]).includes(i))return i;return -1}

const debtTotal=dir=>S.debts.filter(d=>d.dir===dir).reduce((s,d)=>s+Math.max(0,debtRem(d)),0);
/* المصروف والدخل الفعلي بس — المجدول بيظهر لوحده */
function catSpend(mk){const m={},td=today();for(const t of S.txs){if(!t.date||!t.date.startsWith(mk)||t.date>td)continue;

  S.txs.push({id:uid(),type:'trf',amount:+s.amount,acc:s.acc,to:s.to,fee:+s.fee||0,date:s.next,note:'تحويل ثابت: '+s.name,subId:s.id});
  s.lastPaid=s.next;s.next=nextDue(s.next,s.cycle,s.day);return true}
 const ty=isInc(s)?'inc':'exp',cat=s.cat||(ty==='inc'?'مرتب':'اشتراكات');if(!S.cats[ty].includes(cat))S.cats[ty].push(cat);

  else if(dd<=DD)out.push({lv:'warn',ic:'🔁',text:(dd===0?'النهارده: ':`بعد ${dd} يوم: `)+`اشتراك ${s.name} — ${fmt(s.amount)} من ${accName(s.acc)}`,key:'s:'+s.id+':'+s.next,go:'subs',notify:1})}

const AN=s=>digitsEn(s).replace(/[أإآ]/g,'ا').replace(/ة/g,'ه').replace(/ى/g,'ي').replace(/[ً-ْـ]/g,'').toLowerCase().trim();
const QSTOP=new Set(['من','علي','في','ب','ل','عن','و','بـ','لـ','ج','جنيه','جنيه','ج.م','جم','الي','لل','بال'].map(AN));
const QW=l=>l.map(AN);
const QK={yest:QW(['امبارح','إمبارح','امس','أمس']),tod:QW(['النهارده','انهارده','اليوم','النهاردة']),inc:QW(['دخل','قبضت','استلمت','جالي','جاتلي','جاني','وصلني','كسبت']),trf:QW(['حولت','حوّلت','تحويل']),exp:QW(['صرفت','دفعت','مصروف','اشتريت','دفع'])};
const QALIAS={instapay:QW(['انستا','انستاباي','إنستا']),bank:QW(['بنك','البنك','فيزا','الفيزا','كارت']),cash:QW(['كاش','نقدي','نقدا']),wallet:QW(['محفظه','المحفظه'])};
function parseQuick(str){const raw=digitsEn(str||'').replace(/٫/g,'.').trim();if(!raw)return null;
 const toks=raw.split(/\s+/),used=toks.map(()=>false),r={type:'exp',date:today()};
 for(let i=0;i<toks.length;i++){const m=toks[i].replace(/,/g,'').match(/^(\d+(?:\.\d+)?)(k|ك)?$/i);if(m){let v=+m[1];if(m[2])v*=1000;const nx=AN(toks[i+1]||'');if(['الف','الاف','الفين'].includes(nx)){v*=1000;used[i+1]=true}r.amount=v;used[i]=true;break}}
 toks.forEach((t,i)=>{if(used[i])return;const n=AN(t);
  if(QK.yest.includes(n)){const d=new Date();d.setDate(d.getDate()-1);r.date=dstr(d);used[i]=true}
  else if(QK.tod.includes(n))used[i]=true;else if(QK.inc.includes(n)){r.type='inc';used[i]=true}
  else if(QK.trf.includes(n)){r.type='trf';used[i]=true}else if(QK.exp.includes(n))used[i]=true});
 const cands=[];for(const a of S.accounts){const nm=AN(a.name),ws=nm.split(' ');
  for(let i=0;i<toks.length;i++){if(used[i])continue;const t=AN(toks[i]);if(t.length<2||QSTOP.has(t))continue;
   const bi=i+1<toks.length&&!used[i+1]?t+' '+AN(toks[i+1]):'';let sc=0,span=1;
   if(bi&&bi===nm){sc=6;span=2}else if(t===nm)sc=5;else if(ws.includes(t)&&t.length>=3)sc=4;else if(t.length>=3&&nm.startsWith(t))sc=3;else if(t.length>=4&&ws.some(w=>w.startsWith(t)))sc=2;
   else if((QALIAS[a.type]||[]).includes(t))sc=1;if(sc)cands.push({a,i,span,sc})}}
 cands.sort((x,y)=>y.sc-x.sc||x.i-y.i);const accs=[];
 for(const c of cands){if(used[c.i]||(c.span===2&&used[c.i+1])||accs.some(x=>x.a.id===c.a.id))continue;accs.push(c);used[c.i]=true;if(c.span===2)used[c.i+1]=true;if(accs.length>=2)break}
 accs.sort((x,y)=>x.i-y.i);
 if(r.type==='trf'){if(accs.length<2)r.err='اكتب الخزنتين: من و إلى';else{r.acc=accs[0].a.id;r.to=accs[1].a.id}}
 else{r.acc=accs[0]?accs[0].a.id:(accById(S.settings.lastAcc)?S.settings.lastAcc:(S.accounts.find(a=>!isFX(a.id))||{}).id);r.accGuess=!accs.length}
 if(r.type!=='trf'){const left=toks.map((t,i)=>used[i]?null:{i,n:AN(t)}).filter(x=>x&&!QSTOP.has(x.n)&&x.n.length>=2);
  const pools=r.type==='inc'?[['inc',S.cats.inc]]:[['exp',S.cats.exp],['inc',S.cats.inc]];let fd=null;
  for(const lv of[2,1]){for(const x of left){for(const[k,L]of pools){for(const c of L){const cn=AN(c);if(lv===2?cn===x.n:(x.n.length>=3&&cn.length>=3&&(cn.startsWith(x.n)||x.n.startsWith(cn)))){fd={c,k,x};break}}if(fd)break}if(fd)break}if(fd)break}
  if(!fd)for(const x of left){const h=[...S.txs].reverse().find(t=>(t.type==='exp'||t.type==='inc')&&t.note&&AN(t.note).split(/\s+/).includes(x.n));if(h){fd={c:h.cat,k:h.type,hist:1};break}}
  if(fd){r.cat=fd.c;if(fd.k==='inc'&&!S.cats.exp.includes(fd.c))r.type='inc';if(fd.x)used[fd.x.i]=true}else r.cat='أخرى'}
 r.note=toks.filter((t,i)=>!used[i]&&!QSTOP.has(AN(t))).join(' ');
 if(!(r.amount>0))r.err='اكتب المبلغ';else if(!r.acc)r.err=r.err||'مفيش خزنة';
 if(!r.err)for(const id of[r.acc,r.to]){const ac=id&&accById(id);if(ac&&ac.openDate&&r.date<ac.openDate)r.err=`التاريخ قبل بداية خزنة ${ac.name}`}
 return r}

function exportCSV(){const L=cur==='txs'?filteredTxs():[...S.txs].sort((a,b)=>a.date.localeCompare(b.date));
 const tn={exp:'مصروف',inc:'دخل',trf:'تحويل',debt:'دين',adj:'تسوية',gam:'جمعية',asset:'مدخرات',goal:'هدف تحويش'},q=v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"';
 const rows=[['التاريخ','النوع','البند','الخزنة','إلى خزنة','المبلغ','العملة','بالجنيه','رسوم','ملاحظة']].concat(L.map(t=>{const sg=t.type==='exp'||t.sign<0?-1:1;return[t.date,tn[t.type],t.cat||'',accName(t.acc),t.to?accName(t.to):'',sg*t.amount,accCur(t.acc),Math.round(sg*txE(t)*100)/100,t.fee||'',t.note||'']}));
 dl(new Blob(['\ufeff'+rows.map(r=>r.map(q).join(',')).join('\r\n')],{type:'text/csv;charset=utf-8'}),'حركات-'+today()+'.csv')}

 setPin:()=>modal('كلمة السر',`<label>الرقم السري الجديد (من 4 لـ 8 أرقام)<input name="p1" type="password" inputmode="numeric" autocomplete="new-password"></label><label>اكتبها تاني<input name="p2" type="password" inputmode="numeric" autocomplete="new-password"></label><div class="warn" style="font-size:13px">⚠️ لو نسيتها مفيش طريقة ترجعها غير إنك تمسح بيانات المتصفح — خليك عامل نسخة احتياطية.</div>`,f=>{const p1=digitsEn(f.p1||''),p2=digitsEn(f.p2||'');if(!/^\d{4,8}$/.test(p1))return err('أرقام بس، من 4 لـ 8');if(p1!==p2)return err('الاتنين مش زي بعض');S.settings.pin=hash('h$'+p1);S.settings.pinLen=p1.length;save();lockUI();render();toast('🔒 اتحطت كلمة السر')}),
 delPin:()=>{if(!confirm('تشيل القفل؟'))return;S.settings.pin='';S.settings.pinLen=0;save();lockUI();render()},
 saveLock:()=>{S.settings.lockMin=Math.max(0,+$('#sLock').value||0);save();toast('✓ اتحفظ')},lockNow:lock,
 renameCat:()=>{const o=$('#rnOld').value,n=$('#rnNew').value.trim();if(!o||!n||o===n)return toast('اختار البند واكتب الاسم الجديد','warn');
  let c=0;S.txs.forEach(t=>{if(t.cat===o){t.cat=n;c++}});S.subs.forEach(s=>{if(s.cat===o)s.cat=n});
  for(const k of['exp','inc']){const i=S.cats[k].indexOf(o);if(i>=0){if(S.cats[k].includes(n))S.cats[k].splice(i,1);else S.cats[k][i]=n}}
  if(S.budgets[o]!==undefined){S.budgets[n]=(+S.budgets[n]||0)+(+S.budgets[o]);delete S.budgets[o]}save();render();toast(`✓ اتغيّر في ${c} حركة`)},
 paySub:id=>{const s=S.subs.find(x=>x.id===id);if(!s)return;const d=s.next;if(paySub(s)===true){save();render();toast(`✓ ${s.name} اتسجل (${fmtD(d)}) — الجاي ${fmtD(s.next)}`)}},
 skipSub:id=>{const s=S.subs.find(x=>x.id===id);if(!s||!confirm(`تتخطى دفعة ${fmtD(s.next)} من غير ما تتسجل؟`))return;s.next=nextDue(s.next,s.cycle,s.day);save();render()},
 toggleSub:id=>{const s=S.subs.find(x=>x.id===id);if(!s)return;s.active=s.active===false;if(s.active&&s.next<today()){let g=0;while(s.next<today()&&g++<120)s.next=nextDue(s.next,s.cycle,s.day)}save();render()},
 delSub:id=>{if(!confirm('تحذف الاشتراك؟ (المصروفات اللي اتسجلت قبل كده هتفضل)'))return;S.subs=S.subs.filter(s=>s.id!==id);S.txs.forEach(t=>{if(t.subId===id)delete t.subId});save();render()},
 addNote:()=>noteForm(),editNote:id=>noteForm(S.notes.find(n=>n.id===id)),nTab:k=>{NF=k;render()},
 delNote:id=>{if(confirm('تحذف النوت؟')){S.notes=S.notes.filter(n=>n.id!==id);save();render()}},
 pinNote:id=>{const n=S.notes.find(x=>x.id===id);n.pinned=!n.pinned;save();render()},
 doneNote:id=>{const n=S.notes.find(x=>x.id===id);if(n.done)n.done=false;else if(n.remind&&n.repeat&&n.repeat!=='none'){n.remind=advance(n.remind,n.repeat);toast('⏰ التذكير الجاي: '+fmtDT(n.remind))}else n.done=true;save();render()},
 perm:()=>{if(typeof Notification==='undefined')return toast('المتصفح ده مش بيدعم الإشعارات','warn');Notification.requestPermission().then(p=>{toast(p==='granted'?'✓ الإشعارات اتفعلت':'الإشعارات متفعلتش',p==='granted'?'':'warn');render()})},
 tool:k=>{BV.tool=k;BV.linkFrom=null;$$('.btool .tool').forEach(b=>b.classList.toggle('on',b.dataset.id===k));renderWorld()},
 pal:i=>{BV.color=+i;$$('.pal button').forEach(b=>b.classList.toggle('on',b.dataset.id===i));const b=curBoard(),s=BV.sel;if(s&&s.t==='node'){nodeById(b,s.id).c=+i;save()}else if(s&&s.t==='stroke'){const st=b.strokes.find(x=>x.id===s.id);if(st){st.c=PAL[+i][1];save()}}renderWorld()},
 zoom:f=>{const r=cv.getBoundingClientRect();zoomAt(+f,(r.width||800)/2,(r.height||500)/2);save()},fit:()=>fitBoard(),bPng,
 bNew:()=>modal('لوحة جديدة','<label>اسم اللوحة<input name="name" placeholder="مثلاً: خطة السنة، مشروع جديد"></label>',f=>{newBoard(f.name||'لوحة جديدة');BV.sel=null;save();render()}),
 bRen:()=>{const b=curBoard();modal('اسم اللوحة',`<label>الاسم<input name="name" value="${esc(b.name)}"></label>`,f=>{b.name=f.name||b.name;save();render()})},
 bDel:()=>{const b=curBoard();if(!confirm(`تحذف لوحة "${b.name}" بكل اللي فيها؟`))return;S.boards=S.boards.filter(x=>x.id!==b.id);if(!S.boards.length)newBoard('خطتي');S.settings.board=S.boards[0].id;BV.sel=null;save();render()},
 nEdit:()=>{if(BV.sel)nodeForm(BV.sel.id)},nDelM:id=>{BV.sel={t:'node',id};closeM();delSel()},
 nDup:()=>{const b=curBoard(),n=selNode();if(!n)return;const c={...n,id:uid(),x:n.x+30,y:n.y+30};b.nodes.push(c);BV.sel={t:'node',id:c.id};save();renderWorld()},
 eEdit:()=>{if(BV.sel)edgeForm(BV.sel.id)},eRev:()=>{const e=curBoard().edges.find(x=>x.id===BV.sel.id);if(e){[e.from,e.to]=[e.to,e.from];save();renderWorld()}},
 eDash:()=>{const e=curBoard().edges.find(x=>x.id===BV.sel.id);if(e){e.dash=!e.dash;save();renderWorld()}},selDel:delSel,
 saveSet:()=>{S.settings.cur=$('#sCur').value.trim()||'ج.م';S.settings.debtDays=Math.max(0,+$('#sDays').value||0);S.settings.notify=$('#sNot').checked;save();toast('✓ اتحفظ');render()},
 saveCats:()=>{const p=s=>[...new Set($(s).value.split('\n').map(x=>x.trim()).filter(Boolean))];const e=p('#sExp'),i=p('#sInc');if(!e.length||!i.length)return toast('لازم بند واحد على الأقل','warn');S.cats.exp=e;S.cats.inc=i;for(const c in S.budgets)if(!e.includes(c))delete S.budgets[c];save();toast('✓ اتحفظ');render()},
 saveBud:()=>{const nb={};$$('[data-bud]').forEach(el=>{const v=+el.value;if(v>0)nb[S.cats.exp[+el.dataset.bud]]=v});S.budgets=nb;save();toast('✓ اتحفظت الميزانية');render()},
 shareBk:async()=>{const f=new File([JSON.stringify(S)],'حساباتي-نسخة-'+today()+'.json',{type:'application/json'});
  try{await navigator.share({files:[f],title:'نسخة حساباتي '+today()});S.settings.lastBackup=today();save();render();toast('✓ اتشاركت النسخة')}catch(e){if(e&&e.name!=='AbortError')ACT.exp()}},
 install:async()=>{if(!INSTALL)return;INSTALL.prompt();try{const r=await INSTALL.userChoice;if(r.outcome==='accepted')toast('🎉 اتثبّت')}catch(e){}INSTALL=null;render()},
 exp:()=>{S.settings.lastBackup=today();save();dl(new Blob([JSON.stringify(S,null,1)],{type:'application/json'}),'حساباتي-نسخة-'+today()+'.json');render()},
 imp:()=>$('#impFile').click(),
 wipe:()=>{if(!confirm('هيتمسح كل حاجة (خزن، حركات، ديون، نوت، لوحات). متأكد؟'))return;if(!confirm('آخر مرة — مفيش رجوع. نزلت نسخة احتياطية؟ امسح؟'))return;S=seed();save();go('home')}};
document.addEventListener('click',e=>{const a=e.target.closest('[data-act]');if(!a)return;const f=ACT[a.dataset.act];if(f){e.preventDefault();f(a.dataset.id,a)}});
document.addEventListener('keydown',e=>{if(locked){if(e.target.id==='pinTxt'){if(e.key==='Enter')tryUnlock(e.target.value);return}if(/^[0-9٠-٩]$/.test(e.key)){e.preventDefault();lkPress(digitsEn(e.key))}else if(e.key==='Backspace'){e.preventDefault();lkDel()}else if(e.key==='Enter'&&!pinLen()&&PIN.length>=4)tryUnlock(PIN);return}
 const open=$('#modal').classList.contains('open'),inField=/INPUT|TEXTAREA|SELECT/.test(e.target.tagName);
 if((e.ctrlKey||e.metaKey)&&!e.shiftKey&&e.key.toLowerCase()==='z'&&!inField){e.preventDefault();undo();return}
 if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();searchModal();setTimeout(()=>$('#sq')&&$('#sq').focus(),60);return}
 if(e.key==='Escape'){if(open)closeM();else if(cur==='board'){BV.sel=null;BV.linkFrom=null;renderWorld()}return}
 if(open&&e.key==='Enter'&&e.target.tagName==='INPUT'){e.preventDefault();$('#mSave').click();return}
 if(!open&&cur==='board'&&(e.key==='Delete'||e.key==='Backspace')&&!/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)&&BV.sel){e.preventDefault();delSel()}});
document.addEventListener('visibilitychange',()=>{if(document.hidden)return;if(FH&&fileState==='ok'&&!CONF)fileSync();if(cur==='home'&&!$('#modal').classList.contains('open'))render()});
window.addEventListener('storage',e=>{if(e.key===KEY&&e.newValue&&e.newValue!==IDB_MARK&&MODE==='ls'){S=load();lastJ=e.newValue;render()}});
['pointerdown','keydown','wheel','touchstart'].forEach(ev=>document.addEventListener(ev,()=>{if(!locked)lastAct=Date.now()},{passive:true}));
function lockUI(){$('#lockBtn').style.display=S.settings.pin?'':'none'}

/* تشغيل: لو البيانات في المساحة الكبيرة (IndexedDB) بنستنى نقراها الأول */
function startApp(){S.accounts.forEach(a=>{if(!ACCT[a.type])a.type='cash'});
 lastJ=JSON.stringify(S);
 autoSubs();render();save({noUndo:true});UNDO=[];undoBtn();lockUI();if(S.settings.pin)lock();askPersist().then(()=>{if(cur==='settings')render()});
 fileInit().then(()=>{fileBadge();if(cur==='settings')render()})}
if(BOOT_WAIT){$('#view').innerHTML='<div class="empty">⏳ جاري التحميل...</div>';
 (async()=>{let j=null;try{j=await idbGetK('data');const sn=await idbGetK('snaps');SNAPS=sn?JSON.parse(sn):[]}catch(e){}
  BOOT_WAIT=false;if(j){S=normalize(JSON.parse(j))}else toast('مقدرتش أقرا البيانات — استرجع نسخة احتياطية من الإعدادات','bad');startApp()})()}
else startApp();
pwaBoot();
setTimeout(checkNotify,1200);
setInterval(()=>{if(S.settings.pin&&!locked&&+S.settings.lockMin>0&&Date.now()-lastAct>S.settings.lockMin*60000)lock();
 if(autoSubs()&&!$('#modal').classList.contains('open'))render();checkNotify()},30000);
</script>
