name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'android-app/**'
      - '.github/workflows/apk.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Prepare web files
        run: |
          mkdir -p android-app/www
          cp index.html manifest.webmanifest icon-*.png favicon-96.png android-app/www/
          sed -i "s/const APP_BUILD=0;/const APP_BUILD=${{ github.run_number }};/" android-app/www/index.html
          grep -q "const APP_BUILD=${{ github.run_number }};" android-app/www/index.html

      - name: Create Android project
        working-directory: android-app
        run: |
          npm install --no-audit --no-fund
          npx cap add android
          bash customize.sh ${{ github.run_number }}
          npx cap sync android

      - name: Build signed APK
        working-directory: android-app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android-app/android/app/build/outputs/apk/release/app-release.apk hesabaty.apk
          gh release create "v${{ github.run_number }}" hesabaty.apk \
            --title "حساباتي — نسخة ${{ github.run_number }}" \
            --notes "نزّل hesabaty.apk وثبّته. لو التطبيق متثبت قبل كده، التحديث هيتثبت فوقه وبياناتك هتفضل زي ما هي." \
            --latest
